[project]
name = "tle-tracking"
version = "1.3.8"
description = "轻量级轨道监测系统：追踪卫星 TLE 更新，检测轨道变化，分析衰减趋势"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.80.0",
    "grpcio-tools==1.80.0",
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "python-dotenv==1.2.2",
    "fastapi==0.105.0",
    "uvicorn[standard]==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.pytest.ini_options]
# 只收集 tests/ 下的自动化测试；scripts/ 下的集成脚本（需外部服务）不参与
testpaths = ["tests"]
# 将项目根目录加入 sys.path，测试内可直接 import telegram_bot / new_object_watcher / backend.*
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# 中文注释按码点计数，88 会大量误报；120 下仅剩个别超长行
line-length = 120
# api/ 是 protoc 生成的代码，不做人工维护
exclude = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "BLE", "C4", "G", "LOG", "RUF"]
# RUF001-003 把中文全角标点判为歧义字符，对中文注释的项目是纯噪声。
# 未选 W：空白类规则留给将来引入 ruff format 时统一处理，避免现在产生纯空白 diff。
# 未选 S：bandit 会把 tests/ 里的 assert 全部报错，收益不足。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入约定即在默认参数里调用 Depends/Security，B008 对其为误报
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() 必须在业务模块导入前执行，否则模块级读取的环境变量为空
"backend/main.py" = ["E402"]
"telegram_bot.py" = ["E402"]
"scripts/*" = ["E402"]
