name: Release

on:
  push:
    tags:
      - "v*"

# 同一 tag 重复推送时串行处理，避免两次构建并发推送同名镜像
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 忘记 bump 版本号时直接失败，避免镜像里的 pyproject 版本与 tag 不符
      - name: 校验 tag 与 pyproject 版本一致
        run: |
          PY_VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          TAG_VER=${GITHUB_REF_NAME#v}
          # PEP 440 记作 2.0.0rc1，semver tag 记作 v2.0.0-rc1，比较前统一去掉连字符
          if [ "${PY_VER//-/}" != "${TAG_VER//-/}" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pyproject.toml 版本 $PY_VER 不一致"
            exit 1
          fi
          echo "版本一致：$PY_VER"

      - name: Extract tag message
        run: |
          git fetch --tags --force
          # 用环境变量而非表达式插值：tag 名允许包含 ; & | 等字符，直接拼进 shell 会成为注入面
          MSG=$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")
          # 随机分隔符：防止 tag 内容中出现 EOF 行导致 GITHUB_ENV 提前截断
          DELIM="TAG_MESSAGE_$(openssl rand -hex 12)"
          {
            echo "TAG_MESSAGE<<${DELIM}"
            echo "$MSG"
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # 保留历史上的 v 前缀完整标签（v1.3.7），并补充 v1.3 / v1 便于按精度 pin；
          # 预发布 tag（含连字符，如 v2.0.0-rc1）不会移动 latest 与 v1.3 / v1
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.TAG_MESSAGE }}
          tag_name: ${{ github.ref_name }}
          # tag 说明之后追加自动生成的变更列表
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
