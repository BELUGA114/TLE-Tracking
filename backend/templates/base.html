<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TLE-Tracking 仪表盘{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; min-height: 100vh;
        }
        .layout { display: flex; min-height: 100vh; }

        /* 侧边栏 */
        .sidebar {
            width: 220px; background: #1e293b; padding: 1.5rem;
            border-right: 1px solid #334155; flex-shrink: 0;
        }
        .sidebar h1 { font-size: 1.1rem; margin-bottom: 2rem; color: #38bdf8; text-align: center; }
        .sidebar nav { display: flex; flex-direction: column; gap: 0.5rem; }
        .sidebar a {
            color: #94a3b8; text-decoration: none; padding: 0.5rem 0.75rem;
            border-radius: 6px; transition: all 0.15s;
        }
        .sidebar a:hover { background: #334155; color: #e2e8f0; }
        .sidebar a.active { background: #0ea5e9; color: #fff; }

        /* 主内容 */
        .main { flex: 1; padding: 2rem; overflow-x: auto; }
        .page-title { font-size: 1.5rem; margin-bottom: 1.5rem; color: #f1f5f9; }

        /* 卡片 */
        .cards { display: grid; gap: 1rem; margin-bottom: 1.5rem; }
        .cards-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .card {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 1.25rem;
        }
        .card h3 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.5rem; }
        .card .value { font-size: 1.8rem; font-weight: 600; color: #38bdf8; }
        .card .sub { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }

        /* 表格 */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 500; white-space: nowrap; }
        tr:hover { background: #1e293b; }

        /* 标签 */
        .tag {
            display: inline-block; padding: 0.15rem 0.6rem; border-radius: 4px;
            font-size: 0.75rem; font-weight: 500;
        }
        .tag-initial { background: #1e3a5f; color: #60a5fa; }
        .tag-correction { background: #1e3a2f; color: #4ade80; }
        .tag-maneuver { background: #3a1e1e; color: #f87171; }

        /* 状态 */
        .status-normal { color: #4ade80; }
        .status-early { color: #facc15; }
        .status-accelerating { color: #fb923c; }
        .status-critical { color: #f87171; }
        .status-na { color: #64748b; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h1>TLE-Tracking</h1>
            <nav>
                <a href="/" {% if active_page == 'dashboard' %}class="active"{% endif %}>仪表盘</a>
                <a href="/api/history/page" {% if active_page == 'history' %}class="active"{% endif %}>TLE 变化</a>
                <a href="/api/decay/page" {% if active_page == 'decay' %}class="active"{% endif %}>衰降状态</a>
            </nav>
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
