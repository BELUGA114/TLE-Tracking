services:
  tle-tracking:
    # 本地构建（开发/调试）
    build: .
    # 远程拉取（生产环境，标签随版本更新）
    # image: ghcr.io/beluga114/tle-tracking:latest
    container_name: tle-tracking
    restart: unless-stopped
    network_mode: "host"
    # host 模式下 ports 被忽略，uvicorn 直接监听宿主机 0.0.0.0:8000
    volumes:
      # 配置文件（可随时修改，重启容器生效）
      - ./config.yaml:/app/config.yaml
      # 数据持久化（宿主机 ./data/ 目录下查看运行数据）
      - ./data:/data
      # 凭据文件
      # - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      # 数据目录
      - DATA_DIR=/data
      # 代理
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,::1
      # Cesium Ion token（可选，不设则使用 OSM 免费瓦片）
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
      # Space-Track 凭据（需要用到 spacetrack 数据源时必填）
      - SPACETRACK_USER=${SPACETRACK_USER:-}
      - SPACETRACK_PASS=${SPACETRACK_PASS:-}
      # Telegram Bot 凭据（启用新对象发现推送时必填）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
