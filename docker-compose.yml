services:
  tel-tracking:
    build: .
    container_name: tel-tracking
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 配置文件（可随时修改，重启容器生效）
      - ./config.yaml:/app/config.yaml
      # 数据持久化（宿主机 ./data/ 目录下查看运行数据）
      - ./data:/data
      # 凭据文件（Space-Track 模式需要，取消下面注释并创建 .env 文件）
      # - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
